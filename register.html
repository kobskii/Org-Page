<!DOCTYPE html>
<html>
<head>
    <title>Membership Registration</title>
    <link rel="stylesheet" href="css/Styles.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-logo">
            <img src="image/logo.png" alt="Logo" class="logo-img">
        </div>
		<h1 class="reg-name">Registration</h1>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Home</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
   
        <div class="reg-wrapper">
            <form class="reg-form-box">
                <div class="reg-field">
                    <label for="name" class="reg-label">Name:</label>
                    <input type="text" id="name" class="reg-input">
                </div>

                <div class="reg-field">
                    <label for="student_id" class="reg-label">Student ID:</label>
                    <input type="text" id="student_id" class="reg-input">
                </div>

                <div class="reg-field">
                    <label for="course" class="reg-label">Course:</label>
                    <input type="text" id="course" class="reg-input">
                </div>

                <div class="reg-field">
                    <label for="term" class="reg-label">Term:</label>
                    <input type="text" id="term" class="reg-input">
                </div>

                <div class="reg-field">
                    <label for="organization" class="reg-label">Organization / Club:</label>
                    <input type="text" id="organization" class="reg-input">
                </div>

                <div class="reg-submit-wrap">
                    <button type="submit" class="reg-submit">Submit</button>
                </div>
            </form>
        </div>
</body>
</html>
